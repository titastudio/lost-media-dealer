<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOST MEDIA DEALER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

  :root {
    --bg: #0a0a0f;
    --bg2: #0f0f1a;
    --bg3: #13131f;
    --panel: #111118;
    --border: #2a2a3a;
    --border2: #3a3a5a;
    --green: #39ff6e;
    --green2: #1a8c3a;
    --amber: #ffc844;
    --amber2: #c97d00;
    --red: #ff3c5a;
    --red2: #8c1a2a;
    --cyan: #44d4ff;
    --cyan2: #1a6a8c;
    --purple: #b966ff;
    --purple2: #5a1a8c;
    --pink: #ff66b3;
    --text: #e0e0f0;
    --text2: #9090b0;
    --text3: #5a5a7a;
    --scanline: rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier Prime', monospace;
    font-size: 14px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px);
    pointer-events: none;
    z-index: 9999;
    animation: scanMove 8s linear infinite;
  }

  @keyframes scanMove { 0%{background-position:0 0} 100%{background-position:0 40px} }

  .vhs-glitch { animation: vhsGlitch 18s infinite; }
  @keyframes vhsGlitch {
    0%,92%,100%{transform:none;filter:none}
    93%{transform:translateX(-2px) skewX(-1deg);filter:hue-rotate(20deg)}
    94%{transform:translateX(3px);filter:brightness(1.15)}
    95%{transform:translateX(-1px)}
    96%{transform:none}
  }

  #app { max-width: 1200px; margin: 0 auto; padding: 10px; min-height: 100vh; }

  /* HEADER */
  .header {
    border: 1px solid var(--border2);
    background: var(--panel);
    padding: 9px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,rgba(57,255,110,0.03)0%,transparent 50%,rgba(68,212,255,0.03)100%);
    pointer-events: none;
  }
  .logo { font-family:'VT323',monospace; font-size:26px; color:var(--green); letter-spacing:3px; text-shadow:0 0 18px rgba(57,255,110,0.4); line-height:1; }
  .logo span { color:var(--amber); }
  .header-stats { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .stat-chip { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text2); }
  .stat-chip .val { font-family:'VT323',monospace; font-size:20px; line-height:1; }
  .val.money { color:var(--green); }
  .val.rep { color:var(--amber); }
  .val.day { color:var(--cyan); }
  .rec-dot { width:7px; height:7px; border-radius:50%; background:var(--red); animation:blink 1.2s ease-in-out infinite; display:inline-block; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* MINI BARS IN HEADER */
  .header-bar-wrap { display:flex; flex-direction:column; gap:2px; min-width:70px; }
  .header-bar-label { font-size:9px; color:var(--text3); font-family:'Space Mono',monospace; letter-spacing:1px; }
  .header-bar { height:3px; background:var(--border); }
  .header-bar-fill { height:100%; transition:width 0.5s; }

  /* LAYOUT */
  .main-grid { display:grid; grid-template-columns:270px 1fr 255px; gap:8px; align-items:start; }
  .panel { background:var(--panel); border:1px solid var(--border); padding:10px; position:relative; }
  .panel-title { font-family:'VT323',monospace; font-size:17px; letter-spacing:2px; color:var(--text2); border-bottom:1px solid var(--border); padding-bottom:5px; margin-bottom:8px; display:flex; align-items:center; gap:7px; }
  .dot { width:5px; height:5px; border-radius:50%; background:var(--green); animation:blink 2s ease-in-out infinite; }

  /* INVENTORY */
  .inventory-item { border:1px solid var(--border); padding:7px; margin-bottom:5px; cursor:pointer; transition:all 0.15s; position:relative; overflow:hidden; }
  .inventory-item:hover { border-color:var(--border2); background:rgba(255,255,255,0.02); }
  .inventory-item.selected { border-color:var(--cyan2); background:rgba(68,212,255,0.04); }
  .item-format-tag { display:inline-block; font-family:'VT323',monospace; font-size:13px; padding:1px 5px; margin-bottom:3px; letter-spacing:1px; }
  .tag-vhs{background:rgba(255,60,90,.15);color:var(--red);border:1px solid var(--red2);}
  .tag-floppy{background:rgba(68,212,255,.15);color:var(--cyan);border:1px solid var(--cyan2);}
  .tag-dat{background:rgba(185,102,255,.15);color:var(--purple);border:1px solid var(--purple2);}
  .tag-cd{background:rgba(255,200,68,.15);color:var(--amber);border:1px solid var(--amber2);}
  .tag-beta{background:rgba(255,102,179,.15);color:var(--pink);border:1px solid #8c2a5a;}
  .tag-hdd{background:rgba(57,255,110,.15);color:var(--green);border:1px solid var(--green2);}
  .tag-minidv{background:rgba(68,212,255,.08);color:#77eeff;border:1px solid #1a5566;}
  .item-name { font-size:12px; color:var(--text); margin-bottom:2px; line-height:1.3; }
  .item-meta { display:flex; gap:6px; flex-wrap:wrap; }
  .meta-bit { font-size:10px; color:var(--text3); font-family:'Space Mono',monospace; }
  .meta-bit.warn{color:var(--amber2);} .meta-bit.danger{color:var(--red);} .meta-bit.good{color:var(--green2);}
  .mini-bar { height:2px; background:var(--border); margin-top:2px; }
  .mini-bar-fill { height:100%; transition:width 0.3s; }
  .bar-corrupt{background:var(--red2);} .bar-auth{background:var(--green2);} .bar-hype{background:var(--amber);}

  /* DETAIL */
  .center-panel { display:flex; flex-direction:column; gap:8px; }
  .detail-box { background:var(--panel); border:1px solid var(--border); padding:12px; min-height:220px; position:relative; }
  .detail-box .noise { position:absolute; inset:0; opacity:0.015; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); pointer-events:none; }
  .detail-title { font-family:'VT323',monospace; font-size:21px; color:var(--text); letter-spacing:1px; margin-bottom:5px; line-height:1.2; }
  .detail-era { font-size:11px; color:var(--text3); font-family:'Space Mono',monospace; margin-bottom:8px; letter-spacing:1px; }
  .detail-desc { font-size:12px; color:var(--text2); line-height:1.6; margin-bottom:10px; font-style:italic; border-left:2px solid var(--border2); padding-left:9px; }
  .detail-stats-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:10px; }
  .dstat { background:var(--bg2); border:1px solid var(--border); padding:6px 8px; }
  .dstat-label { font-size:9px; color:var(--text3); font-family:'Space Mono',monospace; letter-spacing:1px; margin-bottom:1px; text-transform:uppercase; }
  .dstat-val { font-family:'VT323',monospace; font-size:19px; line-height:1; }
  .auth-fake{color:var(--red);} .auth-partial{color:var(--amber);} .auth-authentic{color:var(--green);} .auth-mythic{color:var(--purple);} .auth-unknown{color:var(--text3);}

  /* BUTTONS */
  .btn { font-family:'VT323',monospace; font-size:15px; letter-spacing:1px; padding:4px 12px; border:1px solid; cursor:pointer; background:transparent; transition:all 0.15s; text-transform:uppercase; }
  .btn:hover{filter:brightness(1.3);background:rgba(255,255,255,0.04);}
  .btn:active{transform:scale(0.97);}
  .btn-restore{color:var(--cyan);border-color:var(--cyan2);}
  .btn-analyze{color:var(--purple);border-color:var(--purple2);}
  .btn-sell{color:var(--green);border-color:var(--green2);}
  .btn-leak{color:var(--amber);border-color:var(--amber2);}
  .btn-destroy{color:var(--red);border-color:var(--red2);}
  .btn-primary{color:var(--green);border-color:var(--green);}
  .btn-mission{color:var(--pink);border-color:#8c2a5a;}
  .btn-disabled{opacity:0.35;cursor:not-allowed;}
  .btn-disabled:hover{filter:none;background:transparent;}
  .btn-help{color:var(--text3);border-color:var(--border2);font-size:13px;padding:2px 7px;}
  .actions-row { display:flex; gap:6px; flex-wrap:wrap; }

  /* BUYER */
  .buyer-item { border:1px solid var(--border); padding:7px; margin-bottom:5px; display:flex; align-items:flex-start; gap:7px; }
  .buyer-icon { font-size:20px; width:26px; text-align:center; line-height:1; padding-top:2px; }
  .buyer-info { flex:1; }
  .buyer-name { font-family:'VT323',monospace; font-size:16px; color:var(--text); line-height:1; margin-bottom:2px; }
  .buyer-desc { font-size:10px; color:var(--text3); margin-bottom:3px; }
  .buyer-offer { font-family:'VT323',monospace; font-size:15px; color:var(--green); }

  /* TICKER */
  .ticker { background:var(--bg2); border:1px solid var(--border); border-top:1px solid var(--green2); padding:3px 10px; overflow:hidden; white-space:nowrap; margin-bottom:8px; }
  .ticker-inner { display:inline-block; animation:scroll 35s linear infinite; font-family:'VT323',monospace; font-size:15px; color:var(--text2); letter-spacing:1px; }
  @keyframes scroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
  .ticker-inner span{color:var(--green);margin-right:4px;}
  .ticker-inner .up{color:var(--green);} .ticker-inner .down{color:var(--red);} .ticker-inner .warn{color:var(--amber);}

  /* LOG */
  .log-box { background:var(--panel); border:1px solid var(--border); padding:7px; height:115px; overflow-y:auto; font-size:11px; font-family:'Space Mono',monospace; }
  .log-box::-webkit-scrollbar{width:3px;} .log-box::-webkit-scrollbar-track{background:var(--bg);} .log-box::-webkit-scrollbar-thumb{background:var(--border2);}
  .log-line{padding:1px 0;color:var(--text3);border-bottom:1px solid rgba(255,255,255,0.02);line-height:1.4;}
  .log-line .ts{color:var(--text3);margin-right:5px;}
  .log-line.good .msg{color:var(--green2);} .log-line.bad .msg{color:var(--red);} .log-line.info .msg{color:var(--cyan2);} .log-line.hype .msg{color:var(--amber);} .log-line.spooky .msg{color:var(--purple);}

  /* MINIGAME */
  .minigame-area { background:var(--bg2); border:1px solid var(--border2); padding:12px; position:relative; overflow:hidden; }
  .minigame-title { font-family:'VT323',monospace; font-size:18px; color:var(--amber); letter-spacing:2px; margin-bottom:8px; }
  .progress-bar-outer { height:16px; background:var(--bg); border:1px solid var(--border2); margin:6px 0; position:relative; overflow:hidden; }
  .progress-bar-fill { height:100%; background:repeating-linear-gradient(90deg,var(--green2) 0px,var(--green) 8px,var(--green2) 16px); animation:barShimmer 1s linear infinite; background-size:32px 100%; transition:width 0.1s; }
  @keyframes barShimmer{0%{background-position:0 0}100%{background-position:32px 0}}
  .click-zone { display:inline-block; padding:7px 24px; background:var(--bg); border:2px solid var(--cyan2); color:var(--cyan); font-family:'VT323',monospace; font-size:20px; letter-spacing:2px; cursor:pointer; transition:all 0.1s; user-select:none; margin:5px 0; }
  .click-zone:hover{border-color:var(--cyan);background:rgba(68,212,255,0.08);}
  .click-zone:active{transform:scale(0.95);}
  .tool-row { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .tool-label { font-size:10px; color:var(--text3); font-family:'Space Mono',monospace; min-width:95px; letter-spacing:1px; text-transform:uppercase; }
  .tool-val { font-family:'VT323',monospace; font-size:17px; color:var(--cyan); min-width:28px; text-align:right; }
  input[type=range]{accent-color:var(--cyan);width:100%;margin:4px 0;}

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal { background:var(--bg2); border:1px solid var(--border2); padding:18px; max-width:540px; width:100%; position:relative; max-height:90vh; overflow-y:auto; }
  .modal::before { content:'▓▓▒▒░░ INCOMING ACQUISITION ░░▒▒▓▓'; display:block; font-family:'VT323',monospace; font-size:12px; color:var(--green2); letter-spacing:1px; margin-bottom:10px; animation:blink 1.5s steps(2) infinite; }
  .modal-close { position:absolute; top:10px; right:12px; font-family:'VT323',monospace; font-size:19px; color:var(--text3); cursor:pointer; background:none; border:none; line-height:1; }
  .modal-close:hover{color:var(--red);}
  .source-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:12px; }
  .source-btn { padding:9px 7px; background:var(--panel); border:1px solid var(--border); cursor:pointer; text-align:center; transition:all 0.15s; }
  .source-btn:hover{border-color:var(--border2);background:rgba(255,255,255,0.03);}
  .source-btn.selected{border-color:var(--cyan2);background:rgba(68,212,255,0.05);}
  .source-icon{font-size:22px;margin-bottom:3px;}
  .source-name{font-family:'VT323',monospace;font-size:16px;color:var(--text);letter-spacing:1px;}
  .source-cost{font-size:10px;color:var(--text3);font-family:'Space Mono',monospace;}

  /* FACTIONS */
  .faction-row { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:7px; }
  .faction-chip { font-family:'VT323',monospace; font-size:13px; padding:2px 7px; border:1px solid; letter-spacing:1px; cursor:pointer; transition:all 0.15s; position:relative; }
  .faction-chip:hover{filter:brightness(1.2);}
  .f-preserv{color:var(--cyan);border-color:var(--cyan2);background:rgba(68,212,255,0.07);}
  .f-elite{color:var(--amber);border-color:var(--amber2);background:rgba(255,200,68,0.07);}
  .f-cult{color:var(--purple);border-color:var(--purple2);background:rgba(185,102,255,0.07);}
  .f-copyright{color:var(--red);border-color:var(--red2);background:rgba(255,60,90,0.07);}
  .f-trend{color:var(--pink);border-color:#8c2a5a;background:rgba(255,102,179,0.07);}
  .f-ai{color:var(--text3);border-color:var(--border2);background:rgba(90,90,122,0.1);}
  .faction-rep-bar { height:2px; margin-top:3px; background:var(--border); }
  .faction-rep-fill { height:100%; transition:width 0.5s; }

  /* HYPE EVENTS */
  .hype-event { background:rgba(255,200,68,0.05); border:1px solid var(--amber2); padding:7px 9px; margin-bottom:5px; animation:fadeIn 0.4s ease; }
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .hype-event-title { font-family:'VT323',monospace; font-size:15px; color:var(--amber); letter-spacing:1px; margin-bottom:1px; }
  .hype-event-desc { font-size:10px; color:var(--text3); font-family:'Space Mono',monospace; line-height:1.4; }

  /* MISSIONS */
  .mission-card { border:1px solid var(--border); padding:9px; margin-bottom:6px; background:rgba(255,102,179,0.03); transition:all 0.15s; }
  .mission-card:hover{border-color:#8c2a5a;}
  .mission-type { font-family:'VT323',monospace; font-size:13px; color:var(--pink); letter-spacing:1px; margin-bottom:2px; }
  .mission-title { font-size:12px; color:var(--text); margin-bottom:3px; }
  .mission-reward { font-family:'VT323',monospace; font-size:15px; color:var(--green); }
  .mission-deadline { font-size:10px; color:var(--text3); font-family:'Space Mono',monospace; }

  /* DECISION MODAL */
  .decision-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:1100; display:flex; align-items:center; justify-content:center; padding:16px; }
  .decision-box { background:var(--bg2); border:1px solid var(--purple2); padding:20px; max-width:480px; width:100%; }
  .decision-title { font-family:'VT323',monospace; font-size:22px; color:var(--purple); letter-spacing:2px; margin-bottom:6px; }
  .decision-body { font-size:12px; color:var(--text2); line-height:1.7; margin-bottom:14px; font-family:'Space Mono',monospace; }
  .decision-choices { display:flex; flex-direction:column; gap:8px; }
  .decision-choice { padding:10px 14px; border:1px solid var(--border2); cursor:pointer; transition:all 0.15s; text-align:left; background:transparent; width:100%; color:var(--text); font-family:'Space Mono',monospace; font-size:11px; }
  .decision-choice:hover{border-color:var(--purple2);background:rgba(185,102,255,0.06);}
  .decision-choice-label { font-family:'VT323',monospace; font-size:17px; color:var(--amber); letter-spacing:1px; margin-bottom:2px; }

  /* WORLD EVENTS */
  .world-event { background:rgba(255,60,90,0.05); border:1px solid var(--red2); padding:7px 9px; margin-bottom:5px; animation:fadeIn 0.5s ease; }
  .world-event-title { font-family:'VT323',monospace; font-size:15px; color:var(--red); letter-spacing:1px; }
  .world-event-desc { font-size:10px; color:var(--text3); font-family:'Space Mono',monospace; }

  /* PROGRESS / GAME STAGE */
  .stage-display { font-family:'VT323',monospace; font-size:13px; color:var(--text3); letter-spacing:1px; }
  .stage-display .stage-name { color:var(--cyan); }

  /* WAVEFORM */
  .waveform { height:36px; display:flex; align-items:center; gap:2px; padding:0 4px; overflow:hidden; opacity:0.55; }
  .wave-bar { flex-shrink:0; width:3px; background:var(--green2); border-radius:1px; transition:height 0.2s; }
  .hidden-trait-badge { display:inline-flex; align-items:center; gap:3px; background:rgba(185,102,255,0.08); border:1px solid var(--purple2); padding:2px 6px; margin:2px; font-size:10px; color:var(--purple); font-family:'Space Mono',monospace; }
  .badge-new { display:inline-block; background:var(--red2); color:var(--red); font-family:'VT323',monospace; font-size:11px; padding:0 4px; letter-spacing:1px; animation:blink 1s steps(2) infinite; }
  .badge-seed { display:inline-block; background:rgba(185,102,255,0.15); color:var(--purple); font-family:'VT323',monospace; font-size:11px; padding:0 4px; letter-spacing:1px; }

  /* TOAST */
  .toast-container { position:fixed; bottom:18px; right:18px; z-index:9000; display:flex; flex-direction:column; gap:7px; }
  .toast { background:var(--panel); border:1px solid var(--border2); padding:9px 13px; font-family:'VT323',monospace; font-size:16px; letter-spacing:1px; animation:toastIn 0.3s ease; max-width:280px; }
  @keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
  .toast.good{border-left:3px solid var(--green);color:var(--green);}
  .toast.bad{border-left:3px solid var(--red);color:var(--red);}
  .toast.info{border-left:3px solid var(--cyan2);color:var(--cyan);}
  .toast.hype{border-left:3px solid var(--amber);color:var(--amber);}
  .toast.spooky{border-left:3px solid var(--purple);color:var(--purple);}

  .scrollable{max-height:390px;overflow-y:auto;padding-right:2px;}
  .scrollable::-webkit-scrollbar{width:3px;} .scrollable::-webkit-scrollbar-track{background:var(--bg);} .scrollable::-webkit-scrollbar-thumb{background:var(--border2);}
  .separator{border:none;border-top:1px solid var(--border);margin:8px 0;}
  .section-label{font-family:'VT323',monospace;font-size:13px;color:var(--text3);letter-spacing:2px;margin-bottom:5px;text-transform:uppercase;}
  .empty-inv{text-align:center;padding:20px 10px;color:var(--text3);font-size:10px;font-family:'Space Mono',monospace;line-height:1.8;}
  .no-item{text-align:center;padding:28px;color:var(--text3);font-size:11px;font-family:'Space Mono',monospace;line-height:1.7;}
  .no-missions{font-size:10px;color:var(--text3);font-family:'Space Mono',monospace;text-align:center;padding:10px;line-height:1.7;}

  /* MARKET DEMAND BARS */
  .demand-row { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .demand-label { font-family:'VT323',monospace; font-size:14px; color:var(--text2); width:55px; }
  .demand-bar { flex:1; height:4px; background:var(--border); position:relative; }
  .demand-fill { height:100%; transition:width 0.8s; }
  .demand-val { font-family:'VT323',monospace; font-size:13px; width:30px; text-align:right; }

  /* TABS */
  .tab-row { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:8px; flex-wrap:wrap; }
  .tab { font-family:'VT323',monospace; font-size:13px; letter-spacing:1px; padding:4px 10px; cursor:pointer; color:var(--text3); border:1px solid transparent; border-bottom:none; margin-bottom:-1px; transition:all 0.15s; }
  .tab:hover{color:var(--text2);}
  .tab.active{color:var(--cyan);border-color:var(--border);background:var(--panel);border-bottom-color:var(--panel);}

  /* CAPACITY */
  .capacity-bar { height:4px; background:var(--border); margin-top:4px; }

const rand  = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick  = arr  => arr[rand(0,arr.length-1)];
const clamp = (v,mn,mx) => Math.max(mn,Math.min(mx,v));

};

// ---- MISSION CHECK (stateless, using stored checkType) ----
function checkMission(m, item, buyerId) {
  if(m.checkType==='recovery')     return item.id===m.targetId && item.corrupt<=20;
  if(m.checkType==='authenticate') return item.id===m.targetId && item.analyzed;
  if(m.checkType==='find_trait')   return item.analyzed && item.traits.includes(m.targetTrait);
  if(m.checkType==='sell_specific') return item.format===m.targetFormat && buyerId===m.targetBuyer;
  if(m.checkType==='hoard') {
    const inv = state.inventory;
    return inv.filter(i=>i.format===m.targetFormat).length >= m.targetCount;
  }
  return false;
}

// ---- ITEM GENERATOR ----
function genItem(qualityMult=1.0, riskBonus=0) {
  const format  = pick(FORMATS);
  const era     = pick(ERAS);
  const genre   = pick(GENRES);
  const cond    = pick(CONDITIONS);
  const myst    = pick(MYSTERY_LAYERS);
  const auth    = pick(['fake','partial','partial','authentic','authentic','mythic','unknown','unknown']);
  const corrupt = clamp(rand(10,85) - Math.round((qualityMult-1)*20), 5, 90);
  const hype    = rand(5,35);
  const rarity  = clamp(rand(20,95) + Math.round((qualityMult-1)*15), 10, 99);
  const traits  = [];
  if(Math.random()<0.35*qualityMult) traits.push(pick(HIDDEN_TRAITS));
  if(Math.random()<0.15*qualityMult) traits.push(pick(HIDDEN_TRAITS.filter(t=>!traits.includes(t))));
  const riskPool = ['LOW','MEDIUM','MEDIUM','HIGH','EXTREME'];
  const riskIdx  = clamp(rand(0,4) + Math.round(riskBonus/20), 0, 4);
  const risk     = riskPool[riskIdx];
  const baseValue= Math.round((rarity*9)*(qualityMult)
    + (auth==='authentic'?420:0)
    + (auth==='mythic'?650:0)
    + (format==='BETA'||format==='DAT'?220:0));
  return {
    id:'ITEM_'+Date.now()+'_'+rand(1000,9999),
    name:`${era} ${format} — ${genre}`,
    format, era, genre, condition:cond, mystery:myst,
    auth, corrupt, hype, rarity, traits, risk, baseValue,
    restored:0, analyzed:false, hyped:false,
    desc:`${cond}. ${myst}. Origin: ${pick(['anonymous collector','studio estate','government archive','private collection','auction lot','dead web server','estate of a deceased archivist','unsolicited mail delivery'])}.`,
  };
}

// ---- OFFER CALCULATION ----
function calcOffer(item, buyer) {
  let v = item.baseValue * (1 + item.hype/100) * (1 + item.restored*0.004);
  if(buyer.id==='archivist')   { if(item.auth==='authentic') v*=1.9; if(item.auth==='fake') v*=0.4; }
  if(buyer.id==='conspiracy')  { if(item.auth==='mythic'||item.auth==='unknown') v*=1.7; }
  if(buyer.id==='creator')     { if(item.hype>50) v*=1.6; v*=(1+item.hype/150); }
  if(buyer.id==='researcher')  { v*=(1+item.traits.length*0.35); if(item.analyzed) v*=1.3; }
  if(buyer.id==='blackmarket') { if(item.rarity>75) v*=2.1; if(item.risk==='EXTREME') v*=1.4; }
  if(buyer.id==='niche')       { v*=1.2; if(parseInt(item.era)<1990) v*=1.3; }
  const hypeBonus = state.hypeEvents.slice(0,3).reduce((acc,e)=>acc*e.mult,1);
  v *= hypeBonus;
  const demandFactor = (state.marketDemand[item.format]||50)/50;
  v *= demandFactor;
  const fRep = state.factionRep;
  if(buyer.id==='archivist'&&fRep.preserv>60) v*=1.1;
  if(buyer.id==='blackmarket'&&fRep.elite>60) v*=1.1;
  if(buyer.id==='conspiracy'&&fRep.cult>60) v*=1.1;
  return Math.round(v);
}

// ---- MISSION GENERATOR ----
function genMission() {
  const inv = state.inventory;
  const tpl = pick(MISSION_TYPES);
  if(tpl.id==='recovery'||tpl.id==='authenticate') {
    if(inv.length===0) return null;
    return tpl.gen(pick(inv));
  }
  if(tpl.id==='sell_specific') {
    return tpl.gen(genItem(), pick(BUYERS).id);
  }
  if(tpl.id==='hoard') {
    return tpl.gen();
  }
  return tpl.gen();
}

// ---- SAVE / LOAD ----
function saveGame() {
  try {
    const save = {...state, toasts:[], pendingDecision:null, showModal:false, showHelp:false};
    localStorage.setItem('lmd_save', JSON.stringify(save));
    showToast('Game saved.','info');
  } catch(e){ showToast('Save failed.','bad'); }
}

function loadGame() {
  try {
    const raw = localStorage.getItem('lmd_save');
    if(!raw) { showToast('No save found.','bad'); return; }
    const saved = JSON.parse(raw);
    state = {...makeInitialState(), ...saved, toasts:[], pendingDecision:null, showModal:false, showHelp:false};
    showToast('Game loaded.','good');
    render();
  } catch(e){ showToast('Load failed.','bad'); }
}

function resetGame() {
  if(!confirm('Reset all progress and start a new game? This cannot be undone.')) return;
  try { localStorage.removeItem('lmd_save'); } catch(e){}
  state = makeInitialState();
  initMissions();
  showToast('New game started.','info');
  render();
}

// ---- UPGRADE PURCHASE ----
function buyUpgrade(id) {
  const u = UPGRADES.find(x=>x.id===id);
  if(!u||state.upgrades[id]) return;
  if(u.requires && !state.upgrades[u.requires]) { showToast('Prerequisite not met!','bad'); return; }
  if(state.money < u.cost) { showToast('Not enough funds!','bad'); return; }
  state.money -= u.cost;
  state.upgrades[id] = true;
  u.apply(state);
  log(`Upgrade purchased: ${u.name}`, 'good');
  showToast(`${u.icon} ${u.name} activated!`, 'good');
  render();
}

// ---- WIN/LOSE CHECK ----
function checkEndgame() {
  if(state.gameOver || state.gameWon) return;
  if(state.money >= 25000) {
    state.gameWon = true;
    log('YOU DID IT. $25,000 archived. You are a MYTH CREATOR.', 'good');
    render(); return;
  }
  if(state.day >= 5 && state.money < 50 && state.inventory.length === 0) {
    state.gameOver = true;
    log('Out of funds. Out of artifacts. The Syndicate wins.', 'bad');
    render();
  }
}

  return `

        <div class="buyer-desc">${buyer.tip}</div>

      </div>

function renderWaveform() {
  const bars = Array.from({length:38},(_,i)=>{
    const h = Math.round(8+Math.abs(Math.sin(i*0.8+Date.now()*0.001))*26);
    return `<div class="wave-bar" style="height:${h}px"></div>`;
  });
  return `<div class="waveform">${bars.join('')}</div>`;
}

function renderMinigame() {
  const mg = state.minigame;
  const item = state.selectedItem;
  if(!item) return '';

  if(mg.type==='restore') {
    const isGame  = item.format==='FLOPPY'||item.genre==='prototype game';
    const isAudio = item.format==='DAT'||item.genre==='music bootleg';
    let title = '▓ VHS TRACKING REPAIR ▓';
    let hint  = 'Click STABILIZE rapidly to lock the signal. Higher = more restoration. Confirm when ready.';
    if(isGame)  { title='▓ SECTOR RECONSTRUCTION ▓'; hint='Rebuild corrupted data sectors. Higher progress = more recovery. Confirm to apply.'; }
    if(isAudio) { title='▓ AUDIO WAVEFORM REPAIR ▓'; hint='Click to filter noise. Higher progress = less corruption. Confirm when done.'; }
    const overRestoreWarn = item.restored>40;
    const reduction = Math.round(mg.progress*0.38);
    return `
      <div class="minigame-area">
        <div class="minigame-title">${title}</div>
        ${overRestoreWarn?`<div style="font-size:10px;color:var(--amber);font-family:'Space Mono',monospace;margin-bottom:6px;">⚠ WARNING: ${item.restored}% restored. Over-restoration (>65%) risks authenticity downgrade.</div>`:''}
        <div style="font-size:11px;color:var(--text3);font-family:'Space Mono',monospace;margin-bottom:7px;">${hint}</div>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:7px;">
          <div class="tool-label">SIGNAL LOCK</div>
          <div class="progress-bar-outer" style="flex:1;">
            <div class="progress-bar-fill" style="width:${mg.progress}%;"></div>
          </div>
          <div style="font-family:VT323,monospace;font-size:17px;color:${mg.progress>80?'var(--amber)':'var(--green)'};">${mg.progress}%</div>
        </div>
        <div style="font-size:10px;color:var(--text3);font-family:'Space Mono',monospace;margin-bottom:5px;">
          Estimated corruption reduction: <span style="color:var(--cyan);font-family:VT323,monospace;font-size:16px;">-${reduction}%</span>
          &nbsp;→ Result: <span style="color:var(--green);font-family:VT323,monospace;font-size:16px;">${Math.max(2,item.corrupt-reduction)}%</span>
        </div>
        <div class="click-zone" id="mg-click">▶ STABILIZE ◀</div>
        <div style="margin-top:7px;display:flex;gap:6px;">
          <button class="btn btn-restore" id="mg-finish" style="font-size:13px;">CONFIRM RESTORATION</button>
          <button class="btn" id="mg-cancel" style="color:var(--text3);border-color:var(--border2);font-size:13px;">CANCEL</button>
        </div>
      </div>
    `;
  }

  if(mg.type==='analyze') {
    const conf = Math.round((mg.noise+(mg.freq||50)+(mg.phase||50))/3);
    return `
      <div class="minigame-area">
        <div class="minigame-title">◈ SIGNAL ANALYSIS ◈</div>
        <div style="font-size:11px;color:var(--text3);font-family:'Space Mono',monospace;margin-bottom:9px;">Adjust all three filters to maximize confidence. Higher = better trait discovery & authenticity reveal.</div>
        <div class="tool-row">
          <div class="tool-label">NOISE FILTER</div>
          <input type="range" min="0" max="100" value="${mg.noise}" id="mg-noise">
          <div class="tool-val">${mg.noise}</div>
        </div>
        <div class="tool-row">
          <div class="tool-label">FREQ SWEEP</div>
          <input type="range" min="0" max="100" value="${mg.freq}" id="mg-freq">
          <div class="tool-val">${mg.freq}</div>
        </div>
        <div class="tool-row">
          <div class="tool-label">PHASE ALIGN</div>
          <input type="range" min="0" max="100" value="${mg.phase||50}" id="mg-phase">
          <div class="tool-val">${mg.phase||50}</div>
        </div>
        <div style="margin:7px 0;font-size:11px;color:var(--text3);font-family:'Space Mono',monospace;">
          Analysis confidence: <span style="color:var(--purple);font-family:VT323,monospace;font-size:17px;">${conf}%</span>
          &nbsp;&nbsp; Hidden trait chance: <span style="color:${conf>60?'var(--green)':'var(--amber)'};font-family:VT323,monospace;font-size:17px;">${conf>60?'HIGH':'LOW'}</span>
          &nbsp;&nbsp; Auth reveal: <span style="color:${conf>65?'var(--green)':'var(--text3)'};font-family:VT323,monospace;font-size:17px;">${conf>65?'YES':'NO'}</span>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-analyze" id="mg-finish" style="font-size:13px;">RUN SCAN</button>
          <button class="btn" id="mg-cancel" style="color:var(--text3);border-color:var(--border2);font-size:13px;">CANCEL</button>
        </div>
      </div>
    `;
  }
  return '';
}

          <span class="mission-reward">+$${m.rewardMoney.toLocaleString()}</span>
          <span style="font-size:10px;color:var(--text3);font-family:'Space Mono',monospace;margin-left:6px;">+${m.rewardRep}REP</span>

        <span class="mission-deadline" style="color:${urgentColor};">⏳ ${m.daysLeft}d left</span>

  `;
}

  });

  // New game

    render();
  });

  const saveEnd = document.getElementById('btn-save-end');
  if(saveEnd) saveEnd.addEventListener('click',saveGame);

  if(resetBtn) resetBtn.addEventListener('click',resetGame);

  if(helpBtn) helpBtn.addEventListener('click',()=>{state.showHelp=true;render();});

  if(helpClose) helpClose.addEventListener('click',()=>{state.showHelp=false;render();});
  const helpCloseBot = document.getElementById('help-close-bottom');

  });

  // Complete mission

  if(freqSlider) freqSlider.addEventListener('input',e=>{if(state.minigame){state.minigame.freq=+e.target.value;render();}});

  if(phaseSlider) phaseSlider.addEventListener('input',e=>{if(state.minigame){state.minigame.phase=+e.target.value;render();}});

  if(missionBtn) missionBtn.addEventListener('click',()=>{
    if(state.missions.filter(m=>!m.completed).length>=4){showToast('Max 4 active missions!','bad');return;}

    if(m){
      state.missions.push({...m,id:'M_'+Date.now()+'_'+rand(100,999),daysLeft:m.deadline});
      log(`New contract available: ${m.title.substring(0,50)}`, 'info');
      showToast('📋 New contract added!','info');
      render();
    } else {
      showToast('No suitable contract available.','info');
    }
  });

  // Decision
  document.querySelectorAll('[data-decision]').forEach(el=>{
    el.addEventListener('click',()=>resolveDecision(+el.dataset.decision));
  });
}

// Keyboard shortcuts
document.addEventListener('keydown', e=>{
  if(e.key==='?' || e.key==='/') {
    if(!state.showModal&&!state.pendingDecision) { state.showHelp=!state.showHelp; render(); }
  }
  if(e.key==='Escape') {
    let changed = false;
    if(state.showHelp){state.showHelp=false;changed=true;}
    if(state.showModal){state.showModal=false;state.modalItems=[];state.modalPreviewId=null;changed=true;}
    if(state.pendingDecision){/* don't auto-cancel decisions */}
    if(changed) render();
  }
  if(e.key==='a'||e.key==='A') {
    if(!state.showModal&&!state.showHelp&&!state.pendingDecision&&!state.gameOver&&!state.gameWon) {
      state.showModal=true;state.modalItems=[];state.selectedSource=null;state.modalPreviewId=null;render();
    }
  }
  if(e.key==='n'||e.key==='N') {
    if(!state.showModal&&!state.showHelp&&!state.pendingDecision&&!state.gameOver&&!state.gameWon) {
      advanceDay();
    }
  }
  if(e.key==='s'||e.key==='S') {
    if(!state.showModal&&!state.showHelp&&!state.pendingDecision) {
      saveGame();
    }
  }
});

// ===================== LOGIC =====================

function doAction(action) {
  const item = state.selectedItem;
  if(!item) return;

  if(action==='restore') {
    if(state.minigame) return;
    if(item.corrupt<=5){showToast('Already clean.','info');return;}
    state.minigame={type:'restore',progress:0,noise:50};
    log(`Starting restoration: ${item.format} — ${item.genre}`, 'info');
    render();
  }

  if(action==='analyze') {
    if(item.analyzed){showToast('Already analyzed.','info');return;}
    const boost = state.upgrades.analyst_kit ? 20 : 0;
    state.minigame={type:'analyze',progress:0,noise:Math.min(100,rand(20,60)+boost),freq:Math.min(100,rand(20,60)+boost),phase:Math.min(100,rand(20,60)+boost)};
    log(`Running signal analysis on ${item.era} ${item.format}...`, 'info');
    render();
  }

  if(action==='hype_boost') {
    const cost = state.upgrades.hyper_hype ? 100 : 200;
    if(state.money<cost){showToast('Not enough funds for hype campaign!','bad');return;}
    state.money -= cost;
    const boost = rand(12,28) + (state.upgrades.hyper_hype ? 5 : 0);
    item.hype = Math.min(100, item.hype+boost);
    item.hyped = true;
    state.factionRep.trend = Math.min(100, state.factionRep.trend+4);
    log(`Hype campaign launched on ${item.era} ${item.format}. +${boost} hype.`, 'hype');
    showToast(`🔥 +${boost} HYPE! Buzz spreading.`, 'hype');
    render();
  }

  if(action==='leak') {
    state.pendingDecision = {
      subtitle:'LEAK DECISION',
      body:`You're about to release "${item.name.substring(0,60)}" into the public ecosystem. This will spike interest — but you'll lose exclusivity and sell-price ceiling. How do you leak it?`,
      item: item,
      choices:[
        { label:'PUBLIC DUMP', desc:'Post freely. Maximum hype, zero exclusivity.', consequence:'+35 hype, -15% sell price ceiling, +Trend rep', action:'public_leak' },
        { label:'PRIVATE TEASE', desc:'Hint at it. Forum whispers. Controlled hype.', consequence:'+15 hype, minor rep loss, +Cult rep', action:'private_tease' },
        { label:'STAGED LEAK', desc:'Anonymous drop with fingerprints removed.', consequence:'+25 hype, +legal heat, no rep change', action:'staged_leak' },
        { label:'CANCEL', desc:'Keep it exclusive.', consequence:'No change.', action:'cancel' },
      ]
    };
    render();
  }

  if(action==='destroy') {
    state.pendingDecision = {
      subtitle:'DESTRUCTION DECISION',
      body:`Destroy "${item.name.substring(0,60)}"? This cannot be undone. Some knowledge will be lost forever. Preservationists will notice.`,
      item: item,
      choices:[
        { label:'DESTROY IT', desc:'Remove from existence. Permanently.', consequence:'-10 Preservationist rep, -5 rep', action:'confirm_destroy' },
        { label:'KEEP IT', desc:'Return to inventory.', action:'cancel' },
      ]
    };
    render();
  }
}

function resolveDecision(choiceIdx) {
  const d = state.pendingDecision;
  if(!d) return;
  const choice = d.choices[choiceIdx];
  const item = d.item || state.selectedItem;
  state.pendingDecision = null;

  if(!choice || choice.action==='cancel') { render(); return; }

  if(choice.action==='public_leak') {
    item.hype = Math.min(100, item.hype+rand(25,40));
    item.hyped = true;
    item.baseValue = Math.round(item.baseValue*0.85);
    const ev = pick(HYPE_EVENTS);
    state.hypeEvents.unshift(ev);
    if(state.hypeEvents.length>4) state.hypeEvents.pop();
    applyHypeEventEffect(ev);
    state.factionRep.trend = Math.min(100, state.factionRep.trend+12);
    state.rep = clamp(state.rep-rand(3,8),0,100);
    triggerMemeticEffect(item, pick(['trend','obsession']));
    log(`PUBLIC LEAK: ${item.name.substring(0,40)} going viral!`, 'hype');
    showToast('⚡ Public leak! Hype surging!','hype');
  }

  if(choice.action==='private_tease') {
    item.hype = Math.min(100, item.hype+rand(10,18));
    item.hyped = true;
    state.factionRep.cult = Math.min(100, state.factionRep.cult+8);
    state.rep = clamp(state.rep-rand(1,3),0,100);
    log('Private tease circulating on underground forums.', 'spooky');
    showToast('🔮 Tease circulating...','spooky');
  }

  if(choice.action==='staged_leak') {
    item.hype = Math.min(100, item.hype+rand(18,28));
    item.hyped = true;
    state.legalHeat = Math.min(100, state.legalHeat+10);
    const ev = pick(HYPE_EVENTS);
    state.hypeEvents.unshift(ev);
    if(state.hypeEvents.length>4) state.hypeEvents.pop();
    applyHypeEventEffect(ev);
    log('STAGED LEAK: Anonymous drop. Fingerprints removed.', 'hype');
    showToast('⚡ Staged leak deployed!','hype');
  }

  if(choice.action==='confirm_destroy') {
    if(item) {
      state.inventory = state.inventory.filter(i=>i.id!==item.id);
      if(state.selectedItem&&state.selectedItem.id===item.id) state.selectedItem=null;
      state.factionRep.preserv = clamp(state.factionRep.preserv-10,0,100);
      state.rep = clamp(state.rep-5,0,100);
      log(`Destroyed artifact: ${item.name.substring(0,40)}. Knowledge lost.`, 'bad');
      showToast('Artifact destroyed.','bad');
    }
  }

  // Fake-to-archivist warning decision
  if(choice.action==='confirm_sell_fake') {
    const d2 = state._pendingSellFake;
    if(d2) { state._pendingSellFake=null; doSell(d2.buyerId, d2.itemId, true); }
  }
  if(choice.action==='cancel_sell_fake') {
    state._pendingSellFake=null;
  }

  render();
}

function finishMinigame() {
  const item = state.selectedItem;
  const mg   = state.minigame;
  if(!item||!mg) return;

  if(mg.type==='restore') {
    const reduction = Math.round(mg.progress*0.38);
    const oldCorrupt = item.corrupt;
    item.corrupt = Math.max(2, item.corrupt-reduction);
    item.restored = Math.min(100, item.restored+reduction);
    if(item.restored>65) {
      if(item.auth==='authentic') {
        item.auth='partial';
        state.factionRep.preserv = clamp(state.factionRep.preserv-12,0,100);
        log('PURIST BACKLASH: Over-restored! Authenticity degraded.','bad');
        showToast('⚠ Purists enraged! Auth dropped!','bad');
      }
    } else if(item.restored>40 && Math.random()<0.3) {
      log('Restoring carefully. Purists watching.','spooky');
    }
    log(`Restoration complete: corruption ${oldCorrupt}% → ${item.corrupt}%`, 'good');
    showToast(`-${reduction}% corruption!`,'good');
    checkMissionTriggers();
  }

  if(mg.type==='analyze') {
    item.analyzed = true;
    const conf = Math.round((mg.noise+(mg.freq||50)+(mg.phase||50))/3);
    if(conf>55 && Math.random()<0.6) {
      const newTrait = pick(HIDDEN_TRAITS.filter(t=>!item.traits.includes(t)));
      if(newTrait) {
        item.traits.push(newTrait);
        log(`Hidden trait discovered: ${newTrait.replace(/_/g,' ')}`, 'spooky');
        showToast('🔮 Hidden trait found!','spooky');
      }
    }
    if(conf>45 && item.traits.length>1 && Math.random()<0.3) {
      const t2 = pick(HIDDEN_TRAITS.filter(t=>!item.traits.includes(t)));
      if(t2) item.traits.push(t2);
    }
    if(conf>65 && item.auth==='unknown') {
      item.auth = pick(['fake','partial','authentic','mythic']);
      log(`Analysis result: item classified as ${item.auth.toUpperCase()}`, 'spooky');
    }
    if(item.traits.length>0) {
      state.factionRep.cult = Math.min(100, state.factionRep.cult+5);
    }
    log(`Analysis complete. Confidence: ${conf}%. Traits found: ${item.traits.length}`, 'info');
    showToast(`Scan done! ${conf}% confidence.`,'info');
    checkMissionTriggers();
  }

  state.minigame = null;
  render();
}

function doSell(buyerId, itemId, skipWarning=false) {
  const item  = state.inventory.find(i=>i.id===itemId);
  const buyer = BUYERS.find(b=>b.id===buyerId);
  if(!item||!buyer) return;

  // Warn when selling fake to archivist
  if(buyer.id==='archivist' && item.auth==='fake' && !skipWarning) {
    state._pendingSellFake = {buyerId, itemId};
    state.pendingDecision = {
      subtitle:'AUTHENTICITY WARNING',
      body:`This item is classified FAKE. Selling it to Archivists will severely damage your reputation with Preservationists. Are you sure?`,
      choices:[
        { label:'SELL ANYWAY', desc:'Take the money. Reputation be damned.', consequence:'-20 Preserv. rep, -15 personal REP', action:'confirm_sell_fake' },
        { label:'CANCEL', desc:'Find a different buyer.', action:'cancel_sell_fake' },
      ]
    };
    render();
    return;
  }

  const finalPrice = calcOffer(item, buyer);

  if(buyer.id==='archivist') {
    if(item.auth==='fake') {
      state.rep = clamp(state.rep-15,0,100);
      state.factionRep.preserv = clamp(state.factionRep.preserv-20,0,100);
      log('Sold a FAKE to archivists! Reputation hit.','bad');
    } else {
      state.factionRep.preserv = Math.min(100, state.factionRep.preserv+8);
    }
  }
  if(buyer.id==='blackmarket') {
    state.legalHeat = Math.min(100, state.legalHeat+5);
    state.factionRep.copyright = clamp(state.factionRep.copyright-5,0,100);
  }
  if(buyer.id==='conspiracy') {
    state.factionRep.cult = Math.min(100, state.factionRep.cult+6);
  }
  if(buyer.id==='creator') {
    state.factionRep.trend = Math.min(100, state.factionRep.trend+5);
    if(item.hype>60) triggerMemeticEffect(item, pick(['trend','obsession']));
  }
  if(buyer.id==='researcher') {
    if(item.traits.length>1) triggerMemeticEffect(item, 'cult_fandom');
  }

  checkSellMission(item, buyer.id);

  state.money += finalPrice;
  state.rep = clamp(state.rep+rand(1,4),0,100);
  state.totalSold++;
  state.totalEarned = (state.totalEarned||0) + finalPrice;
  state.inventory = state.inventory.filter(i=>i.id!==item.id);
  if(state.selectedItem&&state.selectedItem.id===item.id) state.selectedItem=null;
  state.negotiating = null;

  log(`SOLD: ${item.name.substring(0,38)} → ${buyer.name} for $${finalPrice.toLocaleString()}`, 'good');
  showToast(`$${finalPrice.toLocaleString()} received!`,'good');
  checkEndgame();
  render();
}

function startNegotiate(buyerId, itemId) {
  const item  = state.inventory.find(i=>i.id===itemId);
  const buyer = BUYERS.find(b=>b.id===buyerId);
  if(!item||!buyer) return;
  const baseOffer = calcOffer(item, buyer);
  state.negotiating = { buyerId, itemId, currentOffer:baseOffer, rounds:3 };
  log(`Negotiating with ${buyer.name}...`, 'info');
  render();
}

function doNegAction(action) {
  const neg = state.negotiating;
  if(!neg) return;

  if(action==='accept') {
    doSell(neg.buyerId, neg.itemId, true); // skip fake warning once negotiation initiated
    state.negotiating = null;
    return;
  }
  if(action==='walk') {
    state.negotiating = null;
    log('Walked away from negotiation.','info');
    showToast('Deal abandoned.','info');
    render();
    return;
  }
  if(action.startsWith('counter')) {
    if(neg.rounds<=0){showToast('No rounds left! Accept or walk.','bad');return;}
    const pct = action==='counter10'?0.10:0.25;
    const roll = Math.random();
    neg.rounds--;
    if(roll<0.4) {
      neg.currentOffer = Math.round(neg.currentOffer*(1+pct));
      log(`${BUYERS.find(b=>b.id===neg.buyerId).name} accepted your counter.`,'good');
      showToast('Counter accepted!','good');
    } else if(roll<0.7) {
      const partial = pct*0.5;
      neg.currentOffer = Math.round(neg.currentOffer*(1+partial));
      log('Partial counter: buyer met halfway.','info');
      showToast('Partial counter!','info');
    } else {
      log('Counter rejected. Buyer holding firm.','bad');
      showToast('Counter rejected.','bad');
    }
    render();
  }
}

function triggerMemeticEffect(item, effectKey) {
  if(item.memeticEffect) return;
  if(!MEMETIC_EFFECTS[effectKey]) return;
  item.memeticEffect = effectKey;
  const effect = MEMETIC_EFFECTS[effectKey];
  effect.worldChange(state);
  state.memeticHistory.push({itemName:item.name, effect:effectKey, day:state.day});
  log(`MEMETIC EFFECT: ${effect.label} — ${effect.desc}`, 'spooky');
  showToast(`⚡ ${effect.label}!`,'spooky');
}

function applyHypeEventEffect(ev) {
  if(!ev.worldEffect) return;
  if(ev.worldEffect==='copyright_heat') state.legalHeat=Math.min(100,state.legalHeat+15);
  if(ev.worldEffect==='trust_drop') state.rep=clamp(state.rep-5,0,100);
  if(ev.worldEffect==='market_fakes') state.factionRep.ai=Math.min(100,state.factionRep.ai+10);
  if(ev.worldEffect==='ai_flood') {
    state.factionRep.ai=Math.min(100,state.factionRep.ai+15);
    FORMATS.forEach(f=>{state.marketDemand[f]=Math.min(100,(state.marketDemand[f]||50)+5);});
  }
  if(ev.worldEffect==='legal_heat') state.legalHeat=Math.min(100,state.legalHeat+20);
  if(ev.worldEffect==='cult_surge') state.factionRep.cult=Math.min(100,state.factionRep.cult+15);
}

function checkMissionTriggers() {
  // Used after acquiring or restoring — just triggers render which re-evaluates completable
}

function checkSellMission(item, buyerId) {
  state.missions.forEach(m=>{
    if(m.completed) return;
    if(m.checkType==='sell_specific' && item.format===m.targetFormat && buyerId===m.targetBuyer) {
      completeMissionById(m.id);
    }
    if(m.checkType==='hoard') {
      // Check after sell won't complete hoard (selling reduces inventory), ignore
    }
  });
}

function completeMissionById(mId) {
  const m = state.missions.find(x=>x.id===mId);
  if(!m||m.completed) return;
  m.completed = true;
  state.money += m.rewardMoney;
  state.rep = clamp(state.rep+m.rewardRep,0,100);
  if(m.rewardFaction) {
    const fId = m.rewardFaction.id;
    if(state.factionRep[fId]!==undefined) {
      state.factionRep[fId] = Math.min(100, state.factionRep[fId]+m.rewardFaction.amt);
    }
  }
  log(`MISSION COMPLETE: ${m.title.substring(0,50)} — +$${m.rewardMoney} +${m.rewardRep}REP`, 'good');
  showToast(`Mission complete! +$${m.rewardMoney.toLocaleString()}`,'good');
  render();
}

function browseSource() {
  const source = SOURCES.find(s=>s.id===state.selectedSource);
  if(!source) return;
  if(state.money<source.cost){showToast('Not enough funds to browse!','bad');return;}
  // Don't deduct here; deduct on acquire
  const count = state.upgrades.insider_tip ? rand(4,6) : rand(2,4);
  state.modalItems = Array.from({length:count},()=>genItem(source.qualityMult, source.riskBonus));
  render();
}

function advanceDay() {
  state.day++;

  state.missions = state.missions.map(m=>{
    if(m.completed) return m;
    const daysLeft = m.daysLeft-1;
    if(daysLeft<=0) {
      log(`Mission expired: ${m.title.substring(0,50)}`, 'bad');
      showToast('Contract expired!','bad');
      state.rep = clamp(state.rep-3,0,100);
      return {...m,completed:true,expired:true};
    }
    return {...m,daysLeft};
  });

  if(Math.random()<0.35 && state.missions.filter(m=>!m.completed).length<4) {
    const m = genMission();
    if(m) {
      state.missions.push({...m,id:'M_'+Date.now(),daysLeft:m.deadline});
      log(`New contract available: ${m.title.substring(0,50)}`, 'info');
    }
  }

  if(Math.random()<0.4) {
    const ev = pick(HYPE_EVENTS);
    state.hypeEvents.unshift(ev);
    if(state.hypeEvents.length>4) state.hypeEvents.pop();
    applyHypeEventEffect(ev);
    log(`HYPE EVENT: ${ev.title} — ${ev.desc}`, 'hype');
  }

  if(Math.random()<0.25) {
    const wev = pick(WORLD_EVENTS);
    state.worldEvents.unshift(wev);
    if(state.worldEvents.length>2) state.worldEvents.pop();
    applyWorldEvent(wev);
  } else {
    if(state.worldEvents.length>0) state.worldEvents=[];
  }

  FORMATS.forEach(f=>{
    const delta = rand(-8,8);
    state.marketDemand[f] = clamp((state.marketDemand[f]||50)+delta, 20, 95);
  });

  if(Math.random()<0.65) { const l=pick(LOG_POOL); log(l.msg,l.type); }

  state.inventory.forEach(i=>{ i.hype=Math.max(0,i.hype-rand(2,7)); });

  if(!state.upgrades.rep_shield) state.rep = clamp(state.rep-1,0,100);

  const heatDecay = state.upgrades.heat_sink ? rand(4,10) : rand(2,5);
  state.legalHeat = Math.max(0, state.legalHeat - heatDecay);

  if(state.legalHeat>80 && Math.random()<0.2) {
    const highRiskItem = state.inventory.find(i=>i.risk==='EXTREME'||i.risk==='HIGH');
    if(highRiskItem) {
      state.inventory = state.inventory.filter(i=>i.id!==highRiskItem.id);
      if(state.selectedItem&&state.selectedItem.id===highRiskItem.id) state.selectedItem=null;
      log(`⚠ SEIZURE: Copyright Syndicate raided. Lost: ${highRiskItem.name.substring(0,40)}`, 'bad');
      showToast('⚠ Artifact seized by authorities!','bad');
      state.factionRep.copyright = Math.min(100,state.factionRep.copyright+10);
      state.legalHeat = Math.max(0,state.legalHeat-20);
    }
  }

  showToast(`Day ${state.day} begins.`,'info');
  checkEndgame();
  render();
}

function applyWorldEvent(wev) {
  if(wev.effect==='copyright_heat') { state.legalHeat=Math.min(100,state.legalHeat+20); state.factionRep.copyright=Math.min(100,state.factionRep.copyright+10); }
  if(wev.effect==='rarity_spike')   { FORMATS.forEach(f=>{ state.marketDemand[f]=Math.min(100,(state.marketDemand[f]||50)+12); }); }
  if(wev.effect==='cult_surge')     { state.factionRep.cult=Math.min(100,state.factionRep.cult+15); }
  if(wev.effect==='ai_flood')       { state.factionRep.ai=Math.min(100,state.factionRep.ai+20); FORMATS.forEach(f=>{ state.marketDemand[f]=Math.min(100,(state.marketDemand[f]||50)+8); }); }
  if(wev.effect==='price_drop')     { FORMATS.forEach(f=>{ state.marketDemand[f]=clamp((state.marketDemand[f]||50)-12,20,95); }); }
  if(wev.effect==='hype_surge')     { state.inventory.forEach(i=>{ i.hype=Math.min(100,i.hype+rand(10,20)); }); }
  log(`WORLD EVENT: ${wev.title} — ${wev.desc}`, wev.severity||'info');
}

function log(msg, type='info') {
  state.logs.push({msg, type, day:state.day});
}

function showToast(msg, type='info') {
  const id = Date.now()+rand(0,999);
  state.toasts.push({msg,type,id});
  setTimeout(()=>{state.toasts=state.toasts.filter(t=>t.id!==id);render();},2800);
}

function scrollLog() {
  const lb = document.getElementById('log-box');
  if(lb) lb.scrollTop=0;
}

// ===================== INIT =====================
render();

// Waveform animation
setInterval(()=>{
  if(!state.selectedItem||state.pendingDecision) return;
  document.querySelectorAll('.wave-bar').forEach(b=>{
    const h = Math.round(8+Math.random()*26);
    b.style.height = h+'px';
    b.style.background = h>20?'var(--green)':'var(--green2)';
  });
},280);
</script>
